[package]
name = "proofscan"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Sweeps repositories for classes of defect and gives three-valued verdicts: proven, violated or unknown"

[features]
default = []
# Policy comparison (Zelkova style) against a system libz3.
smt = ["dep:z3"]
# The same, building Z3 from source (cmake and a C++ compiler; slow once).
smt-bundled = ["smt", "z3/bundled"]

[dependencies]
anyhow = "1"
ascent = "0.8.1"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-powershell = "0.26.6"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
z3 = { version = "0.23.0", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
